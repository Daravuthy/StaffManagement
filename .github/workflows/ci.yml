name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CONFIGURATION: Release
      PLATFORM: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\StaffManagement.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\StaffManagement.sln --configuration $env:CONFIGURATION -p:Platform="$env:PLATFORM" --no-restore

      - name: Run unit tests
        shell: pwsh
        run: >
          dotnet test .\tests\StaffManagement.UnitTests\StaffManagement.UnitTests.csproj
          --configuration $env:CONFIGURATION
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory .\TestResults\unit

      - name: Run integration tests
        shell: pwsh
        run: >
          dotnet test .\tests\StaffManagement.IntegrationTests\StaffManagement.IntegrationTests.csproj
          --configuration $env:CONFIGURATION
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory .\TestResults\integration

      - name: Install Playwright browser
        shell: pwsh
        run: |
          $playwright = Join-Path $PWD "tests/StaffManagement.EndToEndTests/bin/Release/net9.0/playwright.ps1"
          if (-not (Test-Path $playwright)) {
            throw "Playwright install script not found at $playwright"
          }
          & $playwright install --with-deps chromium

      - name: Start API and web app
        shell: pwsh
        run: |
          Start-Process dotnet -ArgumentList 'run', '--configuration', $env:CONFIGURATION, '--no-build', '--launch-profile', 'http', '--project', '.\src\StaffManagement.Api\StaffManagement.Api.csproj' -RedirectStandardOutput api.log -RedirectStandardError api.log
          Start-Process dotnet -ArgumentList 'run', '--configuration', $env:CONFIGURATION, '--no-build', '--launch-profile', 'http', '--project', '.\src\StaffManagement.Web\StaffManagement.Web.csproj' -RedirectStandardOutput web.log -RedirectStandardError web.log

      - name: Wait for application startup
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $apiOk = (Invoke-WebRequest -UseBasicParsing http://localhost:5144/health).StatusCode -eq 200
              $webOk = (Invoke-WebRequest -UseBasicParsing http://localhost:5165/_framework/blazor.boot.json).StatusCode -eq 200
              if ($apiOk -and $webOk) {
                exit 0
              }
            }
            catch {
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "Application startup timed out."
          Write-Host "API log:"
          Get-Content api.log
          Write-Host "Web log:"
          Get-Content web.log
          exit 1

      - name: Run end-to-end tests
        shell: pwsh
        env:
          STAFF_MGMT_API_HEALTH_URL: http://localhost:5144/health
          STAFF_MGMT_WEB_URL: http://localhost:5165
        run: >
          dotnet test .\tests\StaffManagement.EndToEndTests\StaffManagement.EndToEndTests.csproj
          --configuration $env:CONFIGURATION
          --no-build
          --logger "trx;LogFileName=e2e-tests.trx"
          --results-directory .\TestResults\e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            api.log
            web.log
          if-no-files-found: warn
