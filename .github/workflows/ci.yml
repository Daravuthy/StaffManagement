name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CONFIGURATION: Release
      PLATFORM: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\StaffManagement.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\StaffManagement.sln --configuration $env:CONFIGURATION -p:Platform="$env:PLATFORM" --no-restore
